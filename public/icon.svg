<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background for modern app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#6366f1" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Cashback Badge -->
  <circle cx="256" cy="256" r="145" fill="url(#coinGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="125" fill="#f59e0b" stroke="#fef3c7" stroke-width="6" />

  <!-- Rupee Symbol + Lightning Spark -->
  <path d="M210 180h92M210 215h92M210 180v152M210 250h52a42 42 0 0 0 0-84h-52m52 84l55 82" 
        stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Sparkle stars -->
  <path d="M370 140l8 18 18 8-18 8-8 18-8-18-18-8 18-8z" fill="#ffffff" />
  <path d="M140 350l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#fef08a" />
</svg>
